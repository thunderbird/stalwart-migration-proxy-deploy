---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../bases

namespace: stalwart-migration-proxy

images:
  - name: stalwartlabs/proxy
    newTag: v1.0.4-alpine

patches:
  - path: configmap.yaml
  - path: deployment.yaml
  - path: hpas.yaml
  - path: secrets.yaml
  - path: security-group-policy.yaml
  - path: service.yaml
