---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stalwart-migration-proxy
  namespace: stalwart-migration-proxy
spec:
  template:
    spec:
      containers:
        - name: stalwart-migration-proxy
          image: stalwartlabs/proxy:v1.0-alpine
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "0.5"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          env:
            # Location of the proxy's config file
            - name: PROXY_CONFIG
              value: "/etc/proxy/config.toml"

            # Bearer token
            - name: PROXY_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: stalwart-migration-proxy-bearer-token
                  key: STALWART_MIGRATION_PROXY_BEARER_TOKEN

          ports:
            - name: smtp
              containerPort: 25
            - name: https
              containerPort: 443
            - name: smtps
              containerPort: 465
            - name: submission
              containerPort: 587
            - name: imaps
              containerPort: 993
            - name: sieve
              containerPort: 4190
            # Port 8080 is exposed at the pod level, but not as a public-facing service
            - name: proxy-api
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: proxy-api
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: proxy-api
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: proxy-config-dir
              mountPath: /etc/proxy
              readOnly: true
      volumes:
        - name: proxy-config-dir
          projected:
            sources:
              - configMap:
                  name: stalwart-migration-proxy-config
                  items:
                    - key: config.toml
                      path: config.toml
              - secret:
                  name: ssl-certificate
                  items:
                    - key: tls.crt
                      path: ssl-certificate.crt
                    - key: tls.key
                      path: ssl-certificate.key
