name: validate

concurrency:
  group: validate
  cancel-in-progress: true

on:
  push:
    branches:
      - '**'
      - '!main'
    paths:
      - './bases/**'
      - './overlays/**'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    environment:
      name: staging
      deployment: false
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v4
        id: file-check
        with:
          filters: |
            validate-dockerfiles:
              - 'Dockerfile**'
            validate-kustomize:
              - './bases/**'
              - './overlays/**'

      - name: Test-build Docker images
        if: steps.file-check.outputs.validate-dockerfiles == 'true'
        run: |
          find . -maxdepth 1 -name 'Dockerfile.*' | xargs docker build . -f

      - name: Test-build all Kustomize overlays
        if: steps.file-check.outputs.validate-kustomize == 'true'
        run: ./util/kustomize-build-all.sh
