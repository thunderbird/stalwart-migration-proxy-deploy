name: merge

concurrency:
  group: merge
  cancel-in-progress: true

on:
  push:
    branches:
      - 'main'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    environment:
      name: deploy-mzla-tb-dev
      deployment: false
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v4
        id: file-check
        with:
          filters: |
            dockerfile-util:
              - 'Dockerfile.util'
      
      - name: Configure AWS credentials via GitHub OIDC
        if: steps.file-check.outputs.dockerfile-util == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-central-1
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN }}
          role-session-name: gha-merge-smp-${{ github.run_id }}

      - name: Set up docker buildx
        if: steps.file-check.outputs.dockerfile-util == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push utility image
        if: steps.file-check.outputs.dockerfile-util == 'true'
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: 718959508124.dkr.ecr.eu-central-1.amazonaws.com/stalwart-util:${{github.sha}},718959508124.dkr.ecr.eu-central-1.amazonaws.com/stalwart-util:latest
  